<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DISTORT | متفاوت بپوش!</title>
<meta name="distort-api" content="">
<meta name="description" content="هودی، دورس و تیشرت با طرح آماده یا طرح اختصاصی خودت.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111; --surface:#1a1a1a; --surface-2:#242424; --line:rgba(245,245,245,.13);
  --text:#F5F5F5; --muted:#9b9b9b; --accent:#F5F5F5; --on-accent:#111111;
  --rgb-a:#ffffff; --rgb-b:#767676; --glass:rgba(26,26,26,.58);
  --radius:18px; --radius-sm:12px;
  --font:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --header-h:104px; --nav-h:68px;
}
[data-theme="light"]{
  --bg:#F5F5F5; --surface:#ffffff; --surface-2:#e8e8e8; --line:rgba(17,17,17,.13);
  --text:#111111; --muted:#666666; --accent:#111111; --on-accent:#F5F5F5; --glass:rgba(255,255,255,.62);
  --rgb-a:#111111; --rgb-b:#8a8a8a;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.8;
  padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
img,svg{display:block;max-width:100%}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.header{position:fixed;inset:12px 12px auto 12px;z-index:50;height:var(--header-h);border-radius:24px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line);transition:height .5s cubic-bezier(.22,1,.36,1),inset .5s cubic-bezier(.22,1,.36,1),border-radius .5s}
.header.scrolled{--header-h:60px;border-radius:18px}
.logo{position:absolute;top:50%;right:50%;transform:translate(50%,-50%);display:flex;align-items:center;gap:10px;
  transition:right .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
.header.scrolled .logo{right:18px;transform:translate(0,-50%)}
.logo-mark{width:34px;height:34px;flex:none;transition:width .5s,height .5s}
.header.scrolled .logo-mark{width:26px;height:26px}
.wordmark{font-family:'Vazirmatn',sans-serif;font-weight:900;font-size:clamp(28px,6vw,44px);letter-spacing:-.02em;line-height:1;direction:ltr;
  text-shadow:-2px 0 var(--rgb-a),2px 0 var(--rgb-b);transition:font-size .5s cubic-bezier(.22,1,.36,1),text-shadow .5s}
.header.scrolled .wordmark{font-size:22px;text-shadow:-1px 0 var(--rgb-a),1px 0 var(--rgb-b)}
.logo:hover .wordmark{animation:glitch .35s steps(2) 1}
@keyframes glitch{25%{text-shadow:-5px 1px var(--rgb-a),5px -1px var(--rgb-b)}60%{text-shadow:4px 0 var(--rgb-a),-4px 0 var(--rgb-b)}}
.hd-actions{position:absolute;top:50%;left:14px;transform:translateY(-50%);display:flex;gap:6px;align-items:center}
.icon-btn{position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.login-btn{display:none;padding:8px 16px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
@media(min-width:720px){.login-btn{display:block}}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rgb-a);color:#fff;font-size:11px;
  font-weight:700;display:grid;place-items:center;line-height:1}
.badge:empty,.badge[data-n="0"]{display:none}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;z-index:50;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:min(460px,100% - 24px);height:var(--nav-h);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);
  box-shadow:0 12px 40px rgba(0,0,0,.35)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;
  font-size:11px;color:var(--muted);transition:color .2s,background .25s}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--text);background:var(--surface-2)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .badge{top:4px;right:calc(50% - 22px)}

/* ---------- Sections ---------- */
section{padding-block:56px}
h1,h2,h3{line-height:1.3;font-weight:800}
h2{font-size:clamp(22px,4vw,32px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}
.sec-head p{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:16px;font-weight:700;
  transition:transform .2s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--line);background:var(--surface)}
.btn-ghost:hover{border-color:var(--accent)}
.more{display:flex;justify-content:center;margin-top:28px}

/* Hero */
.hero{padding-top:calc(var(--header-h) + 56px);padding-bottom:40px;overflow:hidden}
.hero-grid{display:grid;gap:36px;align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr 1fr}}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:-.01em}
.hero p{color:var(--muted);max-width:46ch;margin-top:16px;font-size:17px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-art{position:relative;aspect-ratio:1/.9;max-width:520px;width:100%;margin-inline:auto}
.hero-art .g{position:absolute;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45))}
.g1{width:62%;top:2%;right:20%;z-index:2;animation:settle 1.1s cubic-bezier(.22,1,.36,1) both}
.g2{width:46%;bottom:0;right:0;transform:rotate(7deg);animation:settle 1.1s .12s cubic-bezier(.22,1,.36,1) both}
.g3{width:46%;bottom:6%;left:0;transform:rotate(-8deg);animation:settle 1.1s .22s cubic-bezier(.22,1,.36,1) both}
@keyframes settle{from{opacity:0;translate:0 28px;filter:blur(8px) drop-shadow(0 0 0 transparent)}}
.hero-art .ghost{position:absolute;width:62%;top:2%;right:20%;opacity:.5;mix-blend-mode:screen;z-index:1;pointer-events:none}
.ghost.a{translate:-9px 2px;filter:hue-rotate(250deg) saturate(3)}
.ghost.b{translate:9px -2px;filter:hue-rotate(120deg) saturate(3)}

/* Category cards */
.grid-cats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid-cats{grid-template-columns:repeat(5,1fr)}}
.cat{position:relative;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);padding:14px;overflow:hidden;text-align:center;
  transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .3s}
.cat:hover,.cat:active{transform:translateY(-4px);border-color:var(--accent)}
.cat svg{width:78%;margin:0 auto 6px}
.cat b{display:block}
.cat small{color:var(--muted);font-size:12px}
.grid-styles{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid-styles{grid-template-columns:repeat(3,1fr)}}
.style{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;display:flex;align-items:flex-end;padding:16px;text-align:right;
  border:1px solid var(--line);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.style:hover{transform:scale(1.015)}
.style svg.bgm{position:absolute;inset:0;width:100%;height:100%}
.style span{position:relative;font-weight:800;font-size:19px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:4px 14px;border-radius:12px;color:#fff}

/* Product grid */
.grid-prod{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid-prod{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1040px){.grid-prod{grid-template-columns:repeat(5,1fr)}}
.grid-prod.five{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid-prod.five{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1040px){.grid-prod.five{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .art{position:relative;aspect-ratio:1/1.05;background:var(--surface-2);padding:14px;cursor:pointer;width:100%}
.card .art svg{width:100%;height:100%;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.card:hover .art svg{transform:scale(1.05)}
.tags{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px;background:var(--text);color:var(--bg)}
.tag.sale{background:var(--rgb-a);color:#fff}
.tag.hot{background:var(--accent);color:var(--on-accent)}
.heart{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line)}
.heart svg{width:19px;height:19px}
.heart[aria-pressed="true"]{color:var(--rgb-a)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.card .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .nm{font-weight:700;font-size:15px;line-height:1.5}
.card .meta{color:var(--muted);font-size:12px}
.price{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:15px}
.price s{color:var(--muted);font-size:12px}
.card .add{margin-top:10px;padding:9px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.card .add:hover{background:var(--accent);color:var(--on-accent)}

/* Why */
.why{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.why{grid-template-columns:repeat(4,1fr)}}
.why div{padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.why svg{width:28px;height:28px;color:var(--accent);margin-bottom:10px}
.why h3{font-size:16px;margin-bottom:4px}
.why p{font-size:13px;color:var(--muted)}

/* Custom CTA */
.custom{position:relative;overflow:hidden;border-radius:28px;padding:clamp(28px,6vw,64px);background:var(--surface);border:1px solid var(--line);display:grid;gap:28px;align-items:center}
@media(min-width:800px){.custom{grid-template-columns:1.2fr 1fr}}
.custom::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.07) 6px 7px),
  radial-gradient(60% 80% at 0% 100%,rgba(200,200,200,.14),transparent)}
.custom>*{position:relative}
.custom h2{font-size:clamp(28px,5vw,46px)}
.custom p{color:var(--muted);margin:12px 0 22px;max-width:44ch}

/* FAQ */
details{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:10px}
summary{cursor:pointer;padding:16px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--accent);transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 18px 16px;color:var(--muted);font-size:14px}
.support{text-align:center;padding:36px 20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.support p{color:var(--muted);margin:6px 0 18px}

/* Footer */
.doc{max-width:780px;padding-block:96px 40px}.doc h1{font-size:clamp(26px,5vw,38px);margin:6px 0 18px}.doc h3{margin:26px 0 8px;font-size:18px}.doc p,.doc li{color:var(--muted);line-height:1.9}.doc ul{padding-inline-start:22px;margin:6px 0}
.doc details{border-bottom:1px solid var(--line);padding:12px 0}.doc summary{cursor:pointer;font-weight:700}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}.ct>div{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}.ct dt{font-size:13px;color:var(--muted)}.ct dd{margin:4px 0 0;font-weight:700;word-break:break-word}
footer{border-top:1px solid var(--line);padding-block:40px 24px;color:var(--muted);font-size:14px}
.f-grid{display:grid;gap:28px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.f-grid{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.f-grid h4{color:var(--text);margin-bottom:8px;font-size:15px}
.f-grid li{list-style:none;margin-bottom:4px}
.f-grid ul{padding:0}
.f-grid a:hover{color:var(--text)}
.copy{margin-top:28px;text-align:center;font-size:12px}

/* Collections page */
.page-top{padding-top:calc(var(--header-h) + 36px)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:16px 0 22px;font-size:14px}
.toolbar select,.toolbar input[type=range]{accent-color:var(--accent)}
select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:30px;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}

/* Cart */
.row{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.row .th{background:var(--surface-2);border-radius:12px;padding:6px}
.qty{display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:9px;background:var(--surface-2);font-weight:700}
.qty span{min-width:24px;text-align:center}
.rm{color:var(--muted);font-size:12px;text-decoration:underline;margin-top:6px;display:block;margin-inline-start:auto}
.sum{padding:20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);margin-top:16px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.sum .tot{color:var(--text);font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* Sheet + search + toast */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;bottom:0;left:50%;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet h3{margin-bottom:2px}
.sheet .big{width:55%;margin:6px auto 14px;background:var(--surface-2);border-radius:18px;padding:12px}
.opt-label{font-size:13px;color:var(--muted);margin:14px 0 8px}
.swatches,.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:3px}
.sz{min-width:46px;height:40px;border-radius:12px;border:1px solid var(--line);padding:0 10px}
.sz[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sheet .btn{width:100%;margin-top:20px}
.search{position:fixed;z-index:95;top:0;inset-inline:0;padding:16px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:0 0 24px 24px;
  transform:translateY(-105%);transition:transform .4s cubic-bezier(.22,1,.36,1);max-height:80vh;overflow:auto}
.search.open{transform:none}
.search-in{display:flex;gap:8px;max-width:640px;margin:0 auto}
.search-in input{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit}
.s-res{max-width:640px;margin:12px auto 0}
.s-res button{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:right;padding:8px;border-radius:12px}
.s-res button:hover{background:var(--surface-2)}
.s-res .th{background:var(--surface-2);border-radius:10px;padding:3px}
.toast{position:fixed;z-index:120;bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;transition:all .3s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-bar{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:8px 14px;font-size:12px;color:var(--muted);margin-bottom:20px}


/* ================= Lively layer ================= */
#intro{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;clip-path:inset(0 0 0 0);transition:clip-path .9s cubic-bezier(.77,0,.18,1)}
#intro.out{clip-path:inset(0 0 100% 0)}
#intro .wordmark{font-size:clamp(46px,13vw,120px);display:block;animation:introG 1.4s steps(1) both}
#intro .bar{width:min(260px,55vw);height:3px;background:var(--line);margin:22px auto 0;border-radius:3px;overflow:hidden}
#intro .bar::after{content:"";display:block;height:100%;background:linear-gradient(90deg,var(--rgb-a),var(--rgb-b));transform-origin:left;transform:scaleX(0);animation:load 1.35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes load{to{transform:scaleX(1)}}
@keyframes introG{0%{text-shadow:-18px 0 var(--rgb-a),18px 0 var(--rgb-b);opacity:.3}15%{text-shadow:14px 3px var(--rgb-a),-14px -3px var(--rgb-b);opacity:1}30%{text-shadow:-8px 0 var(--rgb-a),8px 0 var(--rgb-b)}45%{text-shadow:10px -2px var(--rgb-a),-10px 2px var(--rgb-b)}60%{text-shadow:-4px 0 var(--rgb-a),4px 0 var(--rgb-b)}100%{text-shadow:-2px 0 var(--rgb-a),2px 0 var(--rgb-b)}}

#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;transform-origin:right;transform:scaleX(0);background:linear-gradient(90deg,var(--rgb-b),var(--accent),var(--rgb-a))}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(255,255,255,.13),rgba(255,255,255,.05) 40%,transparent 68%);mix-blend-mode:screen}
@media(hover:none){#glow{display:none}}

.header{animation:hdrIn 1s calc(var(--base,0s) + .1s) cubic-bezier(.22,1,.36,1) backwards}
.nav{animation:navIn 1s calc(var(--base,0s) + .3s) cubic-bezier(.34,1.4,.5,1) backwards}
@keyframes hdrIn{from{transform:translateY(-140%)}}
@keyframes navIn{from{transform:translate(-50%,200%)}}
.logo-mark .la{animation:splitA 3.5s ease-in-out infinite}
.logo-mark .lb{animation:splitB 3.5s ease-in-out infinite}
@keyframes splitA{0%,100%{translate:-1.5px 0}50%{translate:-3px 1px}}
@keyframes splitB{0%,100%{translate:1.5px 0}50%{translate:3px -1px}}
.wordmark{animation:wmGlitch 7s 3s infinite}
@keyframes wmGlitch{0%,92%,100%{translate:0}93%{translate:-3px 0;text-shadow:-6px 0 var(--rgb-a),6px 0 var(--rgb-b)}95%{translate:3px 0;text-shadow:5px 1px var(--rgb-a),-5px -1px var(--rgb-b)}97%{translate:0}}
#intro .wordmark{animation:introG 1.4s steps(1) both}

#app.enter{animation:pageIn .65s cubic-bezier(.22,1,.36,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}

/* reveal */
.rv{opacity:0;transform:translateY(34px) scale(.96);filter:blur(7px)}
.rv.in{opacity:1;transform:none;filter:none;transition:opacity .8s cubic-bezier(.22,1,.36,1) var(--d,0s),transform .9s cubic-bezier(.22,1.1,.36,1) var(--d,0s),filter .7s var(--d,0s)}

/* buttons */
.btn{position:relative;overflow:hidden}
.btn-primary::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.4s 2s infinite}
@keyframes shine{0%{left:-60%}30%,100%{left:140%}}
.btn.mag{transition:translate .15s}
.btn:not(.mag){transition:translate .5s cubic-bezier(.34,1.56,.64,1),transform .2s,background .2s,border-color .2s}

/* hero */
.hero{position:relative}
.blobs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:blob 14s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:rgba(255,255,255,.5);top:-14vmax;right:-10vmax}
.blobs i:nth-child(2){width:34vmax;height:34vmax;background:rgba(255,255,255,.35);bottom:-12vmax;left:-8vmax;animation-duration:18s;animation-delay:-5s}
.blobs i:nth-child(3){width:24vmax;height:24vmax;background:rgba(200,200,200,.28);top:30%;left:34%;animation-duration:22s;animation-delay:-9s}
@keyframes blob{to{transform:translate(8vmax,6vmax) scale(1.25) rotate(40deg)}}
.hero .wrap{position:relative;z-index:2}
.hero h1{animation:h1G 7s 4s infinite}
@keyframes h1G{0%,93%,100%{text-shadow:none}94%{text-shadow:-5px 0 var(--rgb-a),5px 0 var(--rgb-b)}96%{text-shadow:4px 1px var(--rgb-a),-4px -1px var(--rgb-b)}98%{text-shadow:none}}
.w{display:inline-block;animation:wordIn 1s calc(var(--base,0s) + .35s + var(--i)*.14s) cubic-bezier(.22,1,.36,1) backwards}
@keyframes wordIn{from{opacity:0;transform:translateY(50px) skewY(8deg);filter:blur(12px)}}
.w.grad{background:linear-gradient(90deg,var(--rgb-a),var(--accent),var(--rgb-b),var(--accent),var(--rgb-a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:wordIn 1s calc(var(--base,0s) + .35s + var(--i)*.14s) cubic-bezier(.22,1,.36,1) backwards,gshift 5s linear infinite}
@keyframes gshift{to{background-position:300% 0}}
.hero p,.hero-cta,.stats{animation:wordIn 1s calc(var(--base,0s) + .9s) cubic-bezier(.22,1,.36,1) backwards}
.hero-cta{animation-delay:calc(var(--base,0s) + 1.05s)}
.stats{animation-delay:calc(var(--base,0s) + 1.2s);display:flex;gap:28px;margin-top:34px}
.stats b{display:block;font-size:30px;font-weight:900;line-height:1.1;background:linear-gradient(120deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:13px;color:var(--muted)}
.hero-art{--mx:0;--my:0;--scy:0}
.hm{position:absolute;width:62%;top:2%;right:20%;z-index:2;animation:settle 1.1s calc(var(--base,0s) + .5s) cubic-bezier(.22,1,.36,1) backwards,floaty 7s 2.2s ease-in-out infinite;
  translate:calc(var(--mx)*-26px) calc(var(--my)*-18px + var(--scy)*-.12px)}
.hm .g{position:relative;width:100%;top:auto;right:auto;animation:none}
.hm .ghost{inset:0;top:0;right:0;width:100%;translate:none}
.hm .ghost.a{animation:ghostA 5s infinite}
.hm .ghost.b{animation:ghostB 5s infinite}
@keyframes ghostA{0%,100%{translate:-9px 2px}88%{translate:-9px 2px}91%{translate:-30px 5px}94%{translate:6px -3px}}
@keyframes ghostB{0%,100%{translate:9px -2px}88%{translate:9px -2px}91%{translate:32px -4px}94%{translate:-8px 3px}}
.g2{--r:7deg;transform:rotate(var(--r));animation:settle 1.1s calc(var(--base,0s) + .7s) cubic-bezier(.22,1,.36,1) backwards,floaty 8s 2.5s ease-in-out infinite;
  translate:calc(var(--mx)*34px) calc(var(--my)*22px + var(--scy)*.06px)}
.g3{--r:-8deg;transform:rotate(var(--r));animation:settle 1.1s calc(var(--base,0s) + .85s) cubic-bezier(.22,1,.36,1) backwards,floaty 9s 3s ease-in-out infinite reverse;
  translate:calc(var(--mx)*-40px) calc(var(--my)*26px + var(--scy)*-.05px)}
@keyframes floaty{50%{transform:translateY(-16px) rotate(calc(var(--r,0deg) + 2.5deg))}}

/* marquee */
.marq{padding:30px 0;overflow:hidden;direction:ltr}
.mq{overflow:hidden;white-space:nowrap;padding:14px 0;margin:-4px 0}
.mq.a{background:var(--accent);color:var(--on-accent);transform:rotate(-1.6deg) scale(1.04)}
.mq.b{transform:rotate(1.4deg) scale(1.04);background:var(--surface);border-block:1px solid var(--line)}
.track{display:inline-flex;gap:28px;animation:mq 30s linear infinite;will-change:transform}
.mq.b .track{animation-direction:reverse;animation-duration:38s}
.mq span{font-size:clamp(26px,5vw,44px);font-weight:900;font-family:var(--font)}
.mq.b span{color:transparent;-webkit-text-stroke:1.5px var(--text)}
.star{width:22px;height:22px;flex:none;align-self:center;background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spin 6s linear infinite}
.mq.b .star{background:var(--rgb-a)}
@keyframes mq{to{transform:translateX(-25%)}}
@keyframes spin{to{rotate:360deg}}
.marq:hover .track{animation-play-state:paused}

/* categories */
.cat{background:linear-gradient(160deg,var(--surface),var(--surface-2));position:relative}
.cat::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,var(--accent),transparent 30%);opacity:0;animation:spin 5s linear infinite;transition:opacity .4s}
.cat::after{content:"";position:absolute;inset:1px;border-radius:calc(var(--radius) - 1px);background:var(--surface)}
.cat:hover::before{opacity:.9}
.cat>*{position:relative;z-index:1}
.cat svg{animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.grid-cats>:nth-child(2n) svg{animation-delay:-1.4s}.grid-cats>:nth-child(3n) svg{animation-delay:-2.6s}
.cat:hover svg{animation:wobble .7s}
@keyframes bob{50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes wobble{20%{transform:rotate(-8deg) scale(1.1)}45%{transform:rotate(7deg) scale(1.12)}70%{transform:rotate(-3deg) scale(1.08)}100%{transform:rotate(0) scale(1.06)}}
.style{background-size:220% 220%!important;animation:bgshift 9s ease infinite}
.style:hover{transform:scale(1.03) rotate(-.6deg)}
.style svg.bgm{animation:drift 10s ease-in-out infinite alternate}
.style:hover svg.bgm{animation-duration:3s}
.style::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(120%);transition:transform .8s}
.style:hover::after{transform:translateX(-120%)}
@keyframes bgshift{50%{background-position:100% 100%}}
@keyframes drift{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.18) rotate(4deg) translateY(-6px)}}

/* cards */
.card{position:relative;transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .3s;transform-style:preserve-3d}
.card:hover{border-color:var(--accent);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px var(--accent)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.16),transparent 55%);opacity:0;transition:opacity .3s}
.card.tilt::after{opacity:1}
.card .art svg{filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.card:hover .art svg{transform:scale(1.1) rotate(-2deg) translateY(-4px)}
.tag.sale{animation:pulse 2s ease-in-out infinite}
.tag.hot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 14px var(--rgb-a)}}
.heart{transition:transform .2s}
.heart:hover{transform:scale(1.15)}
.heart.pop svg{animation:heartpop .55s cubic-bezier(.34,1.8,.5,1)}
@keyframes heartpop{0%{transform:scale(1)}35%{transform:scale(1.7)}100%{transform:scale(1)}}
.dot{position:fixed;width:8px;height:8px;border-radius:50%;z-index:220;pointer-events:none}
.flyer{position:fixed;z-index:220;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.flyer svg{width:100%;height:100%}
.card .add{position:relative;overflow:hidden}
.card .add:active{transform:scale(.95)}

/* why */
.why div{transition:transform .35s cubic-bezier(.34,1.56,.64,1),border-color .3s,background .3s}
.why div:hover{transform:translateY(-8px);border-color:var(--accent);background:var(--surface-2)}
.why svg{transition:transform .5s cubic-bezier(.34,1.8,.5,1)}
.why div:hover svg{transform:rotate(-14deg) scale(1.3)}

/* custom CTA */
.custom::after{content:"";position:absolute;left:0;right:0;top:-90px;height:90px;background:linear-gradient(transparent,rgba(200,200,200,.18),transparent);animation:scan 4.5s linear infinite;pointer-events:none}
@keyframes scan{to{transform:translateY(560px)}}
.custom>div:last-child{animation:floaty 6s ease-in-out infinite}

/* faq */
details{transition:border-color .3s,background .3s}
details[open]{border-color:var(--accent);background:var(--surface-2)}
details[open] p{animation:drop .4s cubic-bezier(.22,1,.36,1)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
summary{transition:padding .3s}
summary:hover{padding-inline-start:26px}

/* nav pill + badges */
.nav{overflow:hidden}
.nav .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:20px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line),0 0 24px rgba(255,255,255,.22);transition:transform .55s cubic-bezier(.34,1.35,.5,1),width .4s;z-index:0}
.nav button{z-index:1}
.nav button[aria-current="page"]{background:none}
.nav button.pop svg{animation:navpop .6s cubic-bezier(.34,1.8,.5,1)}
@keyframes navpop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.3) rotate(-8deg)}100%{transform:none}}
.badge.bump{animation:bump .5s cubic-bezier(.34,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.8)}}
.icon-btn:active svg{transform:scale(.85)}.icon-btn svg{transition:transform .2s}
.icon-btn:hover svg{transform:rotate(-10deg) scale(1.12)}

/* sheet + chips */
.sheet{transition:transform .6s cubic-bezier(.34,1.25,.5,1)}
.sheet .big svg{animation:swap .45s cubic-bezier(.34,1.8,.5,1)}
@keyframes swap{from{transform:scale(.75) rotate(-8deg);opacity:.2}}
.sw{transition:transform .25s cubic-bezier(.34,1.8,.5,1)}.sw:hover{transform:scale(1.18)}.sw[aria-pressed="true"]{transform:scale(1.15)}
.sz,.chip{transition:transform .2s,background .25s,color .25s,border-color .25s}
.sz:not(:disabled):hover,.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{animation:chipin .4s cubic-bezier(.34,1.8,.5,1)}
@keyframes chipin{from{transform:scale(.85)}}
.toast{transition:all .5s cubic-bezier(.34,1.6,.5,1)}
.row{transition:transform .3s,border-color .3s}.row:hover{transform:translateX(-4px);border-color:var(--accent)}
.empty h3{font-size:22px}
.empty{animation:bob 4s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){#intro,#glow,.blobs{display:none}.rv{opacity:1;transform:none;filter:none}}

/* ===== Logo: text melts into icon on scroll ===== */
.logo{gap:0;transition:right .95s cubic-bezier(.65,0,.25,1) .1s,transform .95s cubic-bezier(.65,0,.25,1) .1s}
.wm-wrap{display:grid;grid-template-columns:1fr;margin-inline-start:10px;transition:grid-template-columns .75s cubic-bezier(.65,0,.25,1),margin .75s cubic-bezier(.65,0,.25,1)}
.wm-wrap .wordmark{display:block;min-width:0;overflow:hidden;white-space:nowrap;padding:6px 6px;margin:-6px -6px;
  transition:opacity .45s ease,transform .75s cubic-bezier(.65,0,.25,1),filter .5s,letter-spacing .75s cubic-bezier(.65,0,.25,1)}
.header.scrolled .wm-wrap{grid-template-columns:0fr;margin-inline-start:0}
.header.scrolled .wm-wrap .wordmark{opacity:0;transform:scale(.35);filter:blur(8px);letter-spacing:-.35em;font-size:clamp(28px,6vw,44px)}
.logo-mark{transition:width .8s cubic-bezier(.65,0,.25,1),height .8s cubic-bezier(.65,0,.25,1)}
.header.scrolled .logo-mark{animation:markSettle 1s .55s cubic-bezier(.34,1.5,.5,1)}
@keyframes markSettle{0%{transform:rotate(0) scale(1)}45%{transform:rotate(-14deg) scale(1.22)}100%{transform:none}}

/* ===== Product page ===== */
.crumbs a:hover{color:var(--text)}
.pgrid{display:grid;gap:30px;margin-top:10px}
@media(min-width:900px){.pgrid{grid-template-columns:1.05fr 1fr;gap:52px;align-items:start}.pgal-wrap{position:sticky;top:96px}}
.pmain{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--gc) 50%,transparent),transparent 66%),var(--surface-2);transition:background .5s}
.pimg{width:80%;height:80%}
.pimg svg{width:100%;height:100%;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45));transition:transform .6s cubic-bezier(.22,1,.36,1);animation:swap .55s cubic-bezier(.34,1.6,.5,1)}
@media(hover:hover){.pmain{cursor:zoom-in}.pmain:hover .pimg svg{transform:scale(1.75)}}
.pthumbs{display:flex;gap:10px;margin-top:12px}
.pthumbs button{position:relative;flex:1;aspect-ratio:1;border-radius:18px;background:var(--surface-2);border:2px solid transparent;padding:10px 10px 18px;transition:transform .3s cubic-bezier(.34,1.8,.5,1),border-color .25s}
.pthumbs button:hover{transform:translateY(-3px)}
.pthumbs button[aria-pressed="true"]{border-color:var(--accent);transform:translateY(-5px)}
.pthumbs small{position:absolute;bottom:4px;inset-inline:0;text-align:center;font-size:11px;color:var(--muted)}
.pthumbs svg{width:100%;height:100%}
.ptags{display:flex;gap:8px;margin-bottom:10px}
.ptags span{font-size:12px;padding:3px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pname{font-size:clamp(28px,4.4vw,42px);font-weight:900}
.pcode{font-size:12px;color:var(--muted);margin-top:2px}
.pprice{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 8px}
.pprice b{font-size:28px}
.pprice s{color:var(--muted)}
.pprice em{font-style:normal;font-size:12px;font-weight:700;background:var(--rgb-a);color:#fff;padding:2px 10px;border-radius:9px;animation:pulse 2s infinite}
.pdesc{color:var(--muted);font-size:14px;max-width:52ch}
.stock{font-size:12px;color:var(--muted)}
.qty.big button{width:40px;height:40px;font-size:18px;border-radius:12px}
.qty.big span{min-width:36px;font-size:17px;font-weight:700}
.pcta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.pcta .btn{flex:1;min-width:150px}
.heart.inl{position:static;width:52px;height:52px;border-radius:16px;flex:none}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.guide{margin-top:26px}
.szt{width:calc(100% - 36px);margin:0 18px 10px;border-collapse:collapse;font-size:14px;text-align:center}
.szt th,.szt td{padding:6px;border-bottom:1px solid var(--line)}
.szt th{color:var(--muted);font-weight:600}
.pspec{margin-top:10px}

/* ===== Logo: icon only, glides to the right on scroll ===== */
.header{container-type:inline-size}
.header .logo,.header.scrolled .logo{top:50%;right:18px;left:auto;gap:0;transform-origin:right center;
  transform:translate(calc(-50cqw + 18px + 24px*1.35),-50%) scale(1.35);
  transition:transform 1s cubic-bezier(.65,0,.25,1)}
.header.scrolled .logo{transform:translate(0,-50%) scale(.64)}
.header .logo-mark,.header.scrolled .logo-mark{width:48px;height:48px;transition:none;animation:none;filter:drop-shadow(0 0 12px rgba(255,255,255,.4))}

/* ===== Scroll-scrubbed header: --p goes 0 -> 1 across the first 170px ===== */
.header,.header.scrolled{height:calc(104px - 44px*var(--p,0));border-radius:calc(24px - 6px*var(--p,0));transition:none}
.header .logo,.header.scrolled .logo{
  transform:translate(calc((1 - var(--p,0))*(-50cqw + 18px + 24px*1.35)),-50%) scale(calc(1.35 - .71*var(--p,0)));transition:none}

/* ===== Monochrome overrides ===== */
.badge{background:var(--text);color:var(--bg)}
.tag{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.tag.sale{background:var(--text);color:var(--bg);border-color:var(--text)}
.tag.hot{background:transparent;color:var(--text);border-color:var(--text)}
.pprice em{background:var(--text);color:var(--bg)}
.blobs i{opacity:.1}
.heart[aria-pressed="true"]{color:var(--text)}
.nav .pill{box-shadow:inset 0 0 0 1px var(--line),0 0 24px rgba(255,255,255,.1)}
.pmain{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--gc) 35%,transparent),transparent 66%),var(--surface-2)}
html[data-theme="light"] .blobs i{background:rgba(0,0,0,.4)}

/* ===== Bilingual / LTR ===== */
html[lang="en"]{--font:'Inter','Vazirmatn',system-ui,sans-serif}
html[lang="en"] body{font-family:var(--font);line-height:1.65}
.lang-btn{width:auto;padding:0 12px;font-weight:800;font-size:13px;border:1px solid var(--line)}
[dir="ltr"] .hd-actions{left:auto;right:14px}
[dir="ltr"] .header .logo,[dir="ltr"] .header.scrolled .logo{right:auto;left:18px;transform-origin:left center;
  transform:translate(calc((1 - var(--p,0))*(50cqw - 18px - 24px*1.35)),-50%) scale(calc(1.35 - .71*var(--p,0)))}
[dir="ltr"] #prog{transform-origin:left}
[dir="ltr"] .tags{right:auto;left:10px}
[dir="ltr"] .heart{left:auto;right:8px}
[dir="ltr"] .heart.inl{right:auto}
[dir="ltr"] .row:hover{transform:translateX(4px)}
[dir="ltr"] .hero h1,[dir="ltr"] .pname{letter-spacing:-.02em}

/* ===== Brand: DISTORT / WEAR DIFFERENTLY ===== */
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.34em;color:var(--muted);margin-bottom:14px;animation:wordIn 1s calc(var(--base,0s) + .25s) cubic-bezier(.22,1,.36,1) backwards}
#intro .wordmark{font-size:clamp(44px,13vw,118px);line-height:.95;letter-spacing:-.02em}
.intro-tag{margin-top:18px;font-weight:700;letter-spacing:.3em;font-size:clamp(12px,2.6vw,18px);color:var(--muted);opacity:0;animation:wordIn .8s .5s cubic-bezier(.22,1,.36,1) forwards}
.hero h1{line-height:1.15}

/* ===== Real logo (star) ===== */
.logo-mark{object-fit:contain;display:block}
.intro-logo{display:block;width:clamp(72px,17vw,132px);margin:0 auto 16px;filter:drop-shadow(0 0 26px rgba(255,255,255,.35));animation:starIn 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes starIn{0%{opacity:0;transform:scale(.15) rotate(-140deg);filter:blur(10px)}60%{opacity:1;transform:scale(1.12) rotate(8deg);filter:blur(0)}100%{transform:none}}
.f-brand{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:.06em}
.f-brand img{width:28px;height:28px}
html[data-theme="light"] .logo-mark,html[data-theme="light"] .intro-logo,html[data-theme="light"] .f-brand img{filter:invert(1)}

/* ===== Uploaded product photos ===== */
.pphoto,.card .art img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.card:hover .art img{transform:scale(1.06)}
.pimg img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .6s cubic-bezier(.22,1,.36,1);animation:swap .55s cubic-bezier(.34,1.6,.5,1)}
@media(hover:hover){.pmain:hover .pimg img{transform:scale(1.75)}}
.pthumbs img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.pmain .pimg{width:92%;height:92%}

.style-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,1,.36,1)}

.style.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%);z-index:1}
.style.has-img span{z-index:2}

function related(p){
  return PRODUCTS.filter(x=>x.id!==p.id).map(x=>({x,sc:(x.type===p.type?3:0)+(x.style===p.style?3:0)+(1-Math.min(1,Math.abs(x.price-p.price)/p.price))}))

document.addEventListener('click',e=>{
  const el=e.target.closest('button,a,[data-open]'); if(!el)return;
  const d=el.dataset;
  if(d.go){go(d.go);closeAll();return}
  if(d.custom!==undefined){e.preventDefault();toast(t('customToast'));return}

  if(d.filterStyle!==undefined){Object.assign(state.filters,{style:d.filterStyle,type:'',page:1});go('collections');if(view==='collections')render();return}
  if(d.sortGo){Object.assign(state.filters,{sort:d.sortGo,type:'',style:'',page:1});go('collections');if(view==='collections')render();return}
  if(d.wish){e.stopPropagation();const id=d.wish;state.wish.has(id)?state.wish.delete(id):state.wish.add(id);const on=state.wish.has(id);
    toast(on?t('tWishAdd'):t('tWishDel'));
    document.querySelectorAll(`[data-wish="${id}"]`).forEach(h=>{h.setAttribute('aria-pressed',on);h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop')});
    if(on)burst(el);wishBadge();if(view==='wishlist')setTimeout(render,350);return}
  if(d.open){closeAll();location.hash='#/product/'+d.open;return}
  if(d.pimg){state.pp.img=d.pimg;$('#pgal').innerHTML=galHTML(curP());return}
  if(d.pcolor!==undefined){state.pp.ci=+d.pcolor;$('#pgal').innerHTML=galHTML(curP());$('#pbuy').innerHTML=buyHTML(curP());return}
  if(d.psize){state.pp.size=d.psize;$('#pbuy').innerHTML=buyHTML(curP());return}
  if(d.pqty){state.pp.qty=Math.min(10,Math.max(1,state.pp.qty+ +d.pqty));$('#pbuy').innerHTML=buyHTML(curP());return}
  if(d.padd!==undefined){pAdd(false);return}
  if(d.pbuy!==undefined){pAdd(true);return}
  if(d.q!==undefined){const r=state.cart[+d.q];r.qty=Math.min(10,Math.max(1,r.qty+ +d.d));render();return}
  if(d.rm!==undefined){state.cart.splice(+d.rm,1);render();return}
  if(d.f!==undefined){state.filters[d.f]=d.v;state.filters.page=1;render();return}
  if(d.pg){state.filters.page=+d.pg;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(el.id==='fclear'){Object.assign(state.filters,{type:'',style:'',sale:false,max:PMAX,page:1});render()}
});

addEventListener('scroll',onScroll,{passive:true});onScroll();

/* ============ FX layer ============ */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);el.classList.add('in');
  const d=(parseFloat(el.style.getPropertyValue('--d'))||0)*1000;setTimeout(()=>el.classList.remove('rv','in'),1500+d)}),{threshold:.1,rootMargin:'0px 0px -5% 0px'});
function countUp(el){const to=+el.dataset.count;let st=null;const step=t=>{st??=t;const k=Math.min(1,(t-st)/1400);el.textContent=fa(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function initFx(){
  if(RM)return;
  ['.pgal-wrap','.pinfo','.sec-head','.grid-cats>*','.grid-styles>*','.grid-prod>*','.why>*','details','.custom','.support','.f-grid>*','.crumbs','.filters','.toolbar','.row','.sum','.marq'].forEach(sel=>{
    document.querySelectorAll(sel).forEach((el,i)=>{el.classList.add('rv');el.style.setProperty('--d',((i%5)*.08)+'s');io.observe(el)})});
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=fa(0);setTimeout(()=>countUp(el),parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base'))*1000+500||500)});
}
function buildNav(){const n=$('#nav');if(n.children.length)return;
  n.innerHTML='<span class="pill"></span>'+NAV.map(([k,i])=>`<button data-go="${k}">${svgI(i)}<span>${t('nav_'+k)}</span>${k==='wishlist'?'<span class="badge" data-wish-badge data-n="0"></span>':''}${k==='cart'?'<span class="badge" data-cart-badge></span>':''}</button>`).join('');}
function updateNav(){const n=$('#nav');let act=null;
  n.querySelectorAll('button').forEach(b=>{const on=b.dataset.go===(view==='product'?'collections':view);if(on){act=b;if(b.getAttribute('aria-current')!=='page'){b.setAttribute('aria-current','page');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}else b.removeAttribute('aria-current')});
  const p=n.querySelector('.pill');if(act){p.style.width=act.offsetWidth+'px';p.style.transform=`translateX(${act.offsetLeft}px)`}}
addEventListener('resize',updateNav);
function wishBadge(){const b=document.querySelector('[data-wish-badge]');b.textContent=state.wish.size?fa(state.wish.size):'';b.dataset.n=state.wish.size;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function bump(){document.querySelectorAll('[data-cart-badge]').forEach(b=>{b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')})}
function burst(el){if(RM)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<10;i++){const d=document.createElement('i');d.className='dot';d.style.cssText=`left:${cx}px;top:${cy}px;background:${i%2?'var(--rgb-a)':'var(--rgb-b)'}`;document.body.appendChild(d);
    const a=i/10*Math.PI*2,dist=30+Math.random()*18;
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*dist}px),calc(-50% + ${Math.sin(a)*dist}px)) scale(0)`,opacity:0}],{duration:620,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove()}}
function fly(svg){if(RM||!svg)return;const r=svg.getBoundingClientRect(),tg=document.querySelector('#nav [data-go=cart]').getBoundingClientRect();
  const c=document.createElement('div');c.className='flyer';c.innerHTML=svg.outerHTML;Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(c);
  const dx=tg.left+tg.width/2-(r.left+r.width/2),dy=tg.top+tg.height/2-(r.top+r.height/2);
  c.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${dx*.45}px,${dy*.45-110}px) scale(.55) rotate(-14deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.07) rotate(24deg)`,opacity:.3}],
    {duration:850,easing:'cubic-bezier(.5,0,.25,1)'}).onfinish=()=>{c.remove();bump()}}

if(!RM){
  /* tilt + magnetic buttons */
  if(FINE)document.addEventListener('pointermove',e=>{
    const c=e.target.closest?.('.card');
    if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--sx',x*100+'%');c.style.setProperty('--sy',y*100+'%');
      c.style.transform=`perspective(800px) rotateY(${(x-.5)*-12}deg) rotateX(${(y-.5)*10}deg) translateY(-5px)`;c.classList.add('tilt')}
    document.querySelectorAll('.card.tilt').forEach(o=>{if(o!==c){o.style.transform='';o.classList.remove('tilt')}});
    const mb=e.target.closest?.('.hero-cta .btn,.custom .btn');
    document.querySelectorAll('.btn.mag').forEach(o=>{if(o!==mb){o.style.translate='';o.classList.remove('mag')}});
    if(mb){const r=mb.getBoundingClientRect();mb.style.translate=`${(e.clientX-r.left-r.width/2)*.2}px ${(e.clientY-r.top-r.height/2)*.3}px`;mb.classList.add('mag')}
  },{passive:true});
  /* glow + hero parallax loop */
  const glow=$('#glow');let gx=innerWidth/2,gy=innerHeight/2,tx=gx,ty=gy,nx=0,ny=0,cx=0,cy=0;
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;nx=e.clientX/innerWidth-.5;ny=e.clientY/innerHeight-.5},{passive:true});
  (function loop(){gx+=(tx-gx)*.12;gy+=(ty-gy)*.12;cx+=(nx-cx)*.07;cy+=(ny-cy)*.07;
    glow.style.transform=`translate3d(${gx}px,${gy}px,0)`;
    const h=document.querySelector('.hero-art');if(h&&scrollY<1100){h.style.setProperty('--mx',cx.toFixed(3));h.style.setProperty('--my',cy.toFixed(3));h.style.setProperty('--scy',scrollY)}
    requestAnimationFrame(loop)})();
}
document.addEventListener('pointermove',e=>{const m=e.target.closest?.('.pmain');if(!m)return;const r=m.getBoundingClientRect(),sv=m.querySelector('.pimg svg,.pimg img');
  if(sv)sv.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`},{passive:true});
/* intro */
(function(){const i=$('#intro');if(RM){i.remove();return}
  document.documentElement.style.setProperty('--base','1.35s');
  setTimeout(()=>i.classList.add('out'),1500);
  setTimeout(()=>{i.remove();document.documentElement.style.setProperty('--base','0s')},2500)})();

/* ============ Language ============ */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=traw(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',traw(e.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=traw(e.dataset.i18nPh));
  const b=$('#langBtn');b.textContent=lang==='fa'?'EN':'فا';b.setAttribute('aria-label',traw('switchLang'));
  document.title=traw('title');}
function setDir(){const h=document.documentElement;h.lang=lang;h.dir=lang==='fa'?'rtl':'ltr';}
function setLang(l){
  lang=l;TYPES=TL[l];STYLES=SL[l];setDir();applyStatic();
  try{localStorage.setItem('ds-lang',l)}catch(e){}
  $('#nav').innerHTML='';render();requestAnimationFrame(updateNav);
  const q=$('#q');if(q.value)q.dispatchEvent(new Event('input'));}
$('#langBtn').addEventListener('click',()=>setLang(lang==='fa'?'en':'fa'));
setDir();applyStatic();

route();
</script>
</body>
</html>
